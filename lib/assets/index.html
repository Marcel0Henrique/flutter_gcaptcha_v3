<html>
<head>
    <title>reCAPTCHA</title>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <script id="recaptcha-script" async defer></script>

</head>
<body>

<script>
    var scriptAdded = false;

    // A MÁGICA ACONTECE AQUI!
    function executeCaptcha(siteKey, action) {
        // 1. Verifica se a biblioteca do Google (grecaptcha) já está pronta
        if (typeof grecaptcha === 'undefined' || typeof grecaptcha.ready === 'undefined') {
            // 2. Se não estiver pronta, espera 100ms e tenta chamar a função novamente
            console.log("reCAPTCHA not ready, retrying in 100ms...");
            setTimeout(function () {
                executeCaptcha(siteKey, action);
            }, 100);
            return; // Sai da execução atual para esperar a próxima tentativa
        }

        // 3. Se estiver pronta, executa o reCAPTCHA normalmente
        if (typeof Captcha !== "undefined") {
            grecaptcha.ready(function () {
                grecaptcha.execute(siteKey, { action }).then(function (token) {
                    Captcha.postMessage(token);
                });
            });
        }
    }

    // AQUI a função foi simplificada, removendo o parâmetro 'action' que não era usado
    function readyCaptcha(dataSiteKey) {
        if (!scriptAdded) {
            var script = document.createElement('script');
            script.type = 'text/javascript';
            script.src = `https://www.google.com/recaptcha/api.js?render=${dataSiteKey}`;
            var head = document.getElementsByTagName('head')[0];
            head.appendChild(script);
            scriptAdded = true;
        }
    }

</script>

<script src="https://static.app/js/static.js" type="text/javascript"></script>
</body>
</html>
